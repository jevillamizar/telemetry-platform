services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_USER: coldchain
      POSTGRES_PASSWORD: coldchain
      POSTGRES_DB: coldchain
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coldchain"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - coldchain

  redis:
    image: redis:8.10.3-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - coldchain

networks:
  coldchain:
    driver: bridge
