# Configuración de Mosquitto para ColdChain Telemetry Platform.
# Ver ADR 0004 (Dynamic Security) y docs/specs/000-scaffolding-entorno.md (T9).

listener 1883
allow_anonymous false

persistence true
persistence_location /mosquitto/data/

log_dest stdout

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json
